name: Deploy Fabric
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment with target configuration and OIDC trust
        type: environment
        required: true
      smoke:
        description: Run the frozen synthetic source pipeline and validate row counts
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: fabric-deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.lock cryptography==46.0.5 PyYAML==6.0.3
      - run: python -m scripts.release_check
      - run: python -m pytest -q
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.lock cryptography==46.0.5
      - name: Validate environment configuration
        env:
          TARGET_JSON: ${{ vars.FABRIC_TARGET_JSON }}
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.deploy import validate
          from uuid import UUID
          target=validate(json.loads(os.environ['TARGET_JSON']))
          UUID(os.environ['CLIENT_ID'])
          assert target['tenant_id']==os.environ['TENANT_ID']
          Path('.runs').mkdir(exist_ok=True)
          Path('.runs/target.json').write_text(json.dumps(target))
          PY
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Deploy and verify
        env:
          RUN_SMOKE: ${{ inputs.smoke }}
        run: |
          args=(apply --config .runs/target.json)
          if [ "$RUN_SMOKE" = "true" ]; then args+=(--smoke); fi
          python -m scripts.deploy "${args[@]}"
      - name: Preserve deployment evidence and submission journals
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fabric-deployment-${{ github.run_id }}
          path: |
            .runs/deploy/*.json
            .runs/live-operations/*.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: ignore
