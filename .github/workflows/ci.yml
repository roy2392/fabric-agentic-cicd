name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock cryptography==46.0.5 PyYAML==6.0.3
      - run: az bicep build --file infra/main.bicep --outfile /tmp/infra-template.json
      - run: python -m scripts.skill_registry --verify
      - run: python -m scripts.release_check
      - run: python -m pytest -q
      - run: python -m scripts.deploy plan --config deployment/target.example.json > deployment-plan.json
      - run: python -m fabric_agents.cli demo --output .runs/ci-demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-deployment-plan
          path: deployment-plan.json
          retention-days: 14
